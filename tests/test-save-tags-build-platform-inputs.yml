name: Test depot build-push-action - save-tags and build-platform inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create minimal Dockerfile for test
        run: |
          mkdir -p /tmp/depot-savetags-ctx
          cat > /tmp/depot-savetags-ctx/Dockerfile <<'EOF'
          FROM scratch
          LABEL test=save-tags
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          context: /tmp/depot-savetags-ctx
          tags: localhost/test-savetags:latest
          save: "true"
          save-tags: myorg/myimage:v1.0.0
          build-platform: linux/amd64
          # No token — action will fail with auth error

      - name: Assert action ran (failed gracefully without token)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no depot token)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
