name: Test attestation and SBOM inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create minimal Dockerfile
        run: |
          mkdir -p /tmp/build-context
          echo 'FROM scratch' > /tmp/build-context/Dockerfile
          mkdir -p /tmp/sbom-output
      - id: action
        uses: .
        continue-on-error: true
        with:
          context: /tmp/build-context
          file: /tmp/build-context/Dockerfile
          token: fake-depot-token
          project: fake-project-id
          attests: type=sbom,generator=image
          provenance: 'true'
          sbom: 'true'
          sbom-dir: /tmp/sbom-output
          annotations: |
            index,manifest:org.opencontainers.image.description=My image
      - name: Assert action ran
        run: |
          echo "Action completed with outcome: ${{ steps.action.outcome }}"
          echo "PASS: action was invoked with attestation inputs"
