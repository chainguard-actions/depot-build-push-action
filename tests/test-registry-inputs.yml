name: Test registry and save inputs coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          token: fake-depot-token
          project: fake-project-id
          labels: |
            org.opencontainers.image.title=myimage
            org.opencontainers.image.version=1.0.0
          save: 'false'
          save-tag: myimage:latest
          save-tags: |
            myimage:latest
            myimage:1.0.0
      - name: Assert action ran (may fail due to invalid token)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          echo "PASS: action step executed"
