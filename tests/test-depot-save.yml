name: Test - Depot save inputs (save-tag, save-tags)
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install depot CLI
        run: |
          curl -L https://depot.dev/install-cli.sh | DEPOT_INSTALL_DIR=/usr/local/bin sh

      - name: Verify depot CLI is installed
        run: depot version

      - name: Set up Docker Buildx
        run: |
          docker buildx create --use --name depot-save-builder 2>/dev/null || true

      - id: action
        uses: .
        continue-on-error: true
        with:
          context: tests/fixtures/docker-context
          file: tests/fixtures/docker-context/Dockerfile
          tags: test-depot-save:latest
          load: 'false'
          push: 'false'
          save: 'true'
          save-tag: 'myimage:v1.0.0'
          save-tags: |
            myimage:latest
            myimage:v1
          buildx-fallback: 'true'
        # No depot token — depot build will fail; save/save-tag/save-tags are depot-specific
        # Fallback to buildx won't support save; accept success or graceful failure

      - name: Assert action ran with save inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with save inputs"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran and failed gracefully (save requires valid depot token)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
