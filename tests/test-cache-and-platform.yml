name: Test cache and platform inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create minimal Dockerfile
        run: |
          mkdir -p /tmp/build-context
          echo 'FROM scratch' > /tmp/build-context/Dockerfile
      - id: action
        uses: .
        continue-on-error: true
        with:
          context: /tmp/build-context
          file: /tmp/build-context/Dockerfile
          token: fake-depot-token
          project: fake-project-id
          platforms: linux/amd64,linux/arm64
          build-platform: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          network: host
          outputs: type=local,dest=/tmp/output
          no-cache-filters: build
      - name: Assert action ran
        run: |
          echo "Action completed with outcome: ${{ steps.action.outcome }}"
          echo "PASS: action was invoked with cache and platform inputs"
