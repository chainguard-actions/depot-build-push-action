name: Test - Target stage, build-contexts, build-platform, and outputs with buildx fallback
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install depot CLI
        run: |
          curl -L https://depot.dev/install-cli.sh | DEPOT_INSTALL_DIR=/usr/local/bin sh

      - name: Verify depot CLI is installed
        run: depot version

      - name: Set up Docker Buildx
        run: |
          docker buildx create --use --name target-builder 2>/dev/null || true

      - name: Create output directory
        run: mkdir -p /tmp/build-output

      - id: action
        uses: .
        with:
          context: tests/fixtures/multistage-context
          file: tests/fixtures/multistage-context/Dockerfile
          tags: test-target-image:latest
          target: base
          build-contexts: extra=tests/fixtures/docker-context
          build-platform: linux/amd64
          outputs: type=local,dest=/tmp/build-output
          load: 'false'
          push: 'false'
          buildx-fallback: 'true'
        # No depot token — depot build will fail, fallback to docker buildx

      - name: Assert action outcome
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with target/build-contexts/build-platform/outputs inputs"
          else
            echo "FAIL: expected success, got '$OUTCOME'"
            exit 1
          fi
