name: Test build configuration inputs coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          token: fake-depot-token
          project: fake-project-id
          build-args: |
            MY_ARG=value
          build-contexts: name=path
          build-platform: linux/amd64
          platforms: linux/amd64,linux/arm64
          target: build-stage
          network: host
          cgroup-parent: /my-cgroup
          shm-size: 2g
          ulimit: nofile=1024:1024
      - name: Assert action ran (may fail due to invalid token)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          echo "PASS: action step executed"
