name: Test depot build-push-action - no token error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create minimal Dockerfile for test
        run: |
          mkdir -p /tmp/depot-test-ctx
          cat > /tmp/depot-test-ctx/Dockerfile <<'EOF'
          FROM scratch
          LABEL test=true
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          context: /tmp/depot-test-ctx
          tags: localhost/test-image:latest
          # No token provided — action should fail with an auth error

      - name: Assert action failed due to missing token
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when no depot token is provided, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed without a depot token"
