name: Test - Multi-platform build with buildx fallback
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install depot CLI
        run: |
          curl -L https://depot.dev/install-cli.sh | DEPOT_INSTALL_DIR=/usr/local/bin sh

      - name: Verify depot CLI is installed
        run: depot version

      - name: Set up QEMU for multi-platform builds
        run: |
          docker run --privileged --rm tonistiigi/binfmt --install all 2>/dev/null || true

      - name: Set up Docker Buildx with multi-platform support
        run: |
          docker buildx create --use --name multi-builder --driver docker-container 2>/dev/null || true

      - id: action
        uses: .
        with:
          context: tests/fixtures/multi-context
          file: tests/fixtures/multi-context/Dockerfile
          tags: test-multi-image:latest
          platforms: linux/amd64
          load: 'false'
          push: 'false'
          buildx-fallback: 'true'
        # No depot token — depot build will fail, fallback to docker buildx

      - name: Assert multi-platform build succeeded
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: multi-platform build succeeded via buildx fallback"
          else
            echo "FAIL: expected success, got '$OUTCOME'"
            exit 1
          fi
