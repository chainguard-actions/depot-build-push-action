name: Test depot build-push-action - secrets, ssh, and build-contexts inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create minimal Dockerfile and secret file for test
        run: |
          mkdir -p /tmp/depot-secrets-ctx
          cat > /tmp/depot-secrets-ctx/Dockerfile <<'EOF'
          FROM scratch
          LABEL test=secrets
          EOF
          echo "mysecretvalue" > /tmp/depot-test-secret.txt

      - id: action
        uses: .
        continue-on-error: true
        with:
          context: /tmp/depot-secrets-ctx
          tags: localhost/test-secrets:latest
          secrets: MY_SECRET=mysecretvalue
          secret-files: MY_FILE=/tmp/depot-test-secret.txt
          ssh: default
          build-contexts: extra=/tmp/depot-secrets-ctx
          # No token — action will fail with auth error

      - name: Assert action ran (failed gracefully without token)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no depot token)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
