name: Test depot build-push-action - secrets, secret-files, and ssh inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create minimal Dockerfile and secret file for test
        run: |
          mkdir -p /tmp/depot-secrets-ctx
          echo "mysecretvalue" > /tmp/depot-secret.txt
          cat > /tmp/depot-secrets-ctx/Dockerfile <<'EOF'
          FROM scratch
          LABEL test=secrets-ssh
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          context: /tmp/depot-secrets-ctx
          tags: localhost/test-secrets:latest
          secrets: 'MY_SECRET=mysecretvalue'
          secret-files: 'MY_SECRET_FILE=/tmp/depot-secret.txt'
          ssh: 'default'
          # No token — action will fail at auth, but inputs are parsed

      - name: Assert action ran with secrets/secret-files/ssh inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with secrets/secret-files/ssh inputs, outcome='$OUTCOME'"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
