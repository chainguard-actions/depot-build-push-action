name: Test depot build-push-action - save input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create minimal Dockerfile for test
        run: |
          mkdir -p /tmp/depot-save-ctx
          cat > /tmp/depot-save-ctx/Dockerfile <<'EOF'
          FROM scratch
          LABEL test=save
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          context: /tmp/depot-save-ctx
          save: 'true'
          save-tag: 'myapp:test'
          # No token — action will fail at auth, but save inputs are parsed

      - name: Assert action ran with save inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
          BUILD_ID: ${{ steps.action.outputs.build-id }}
          PROJECT_ID: ${{ steps.action.outputs.project-id }}
        run: |
          echo "outcome:    $OUTCOME"
          echo "build-id:   $BUILD_ID"
          echo "project-id: $PROJECT_ID"
          # Without a depot token the action fails at authentication.
          # We verify the action ran and produced a deterministic outcome.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with save inputs, outcome='$OUTCOME'"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
