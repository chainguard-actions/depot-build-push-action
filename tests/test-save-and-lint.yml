name: Test save, lint, and misc inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create minimal Dockerfile
        run: |
          mkdir -p /tmp/build-context
          echo 'FROM scratch' > /tmp/build-context/Dockerfile
      - id: action
        uses: .
        continue-on-error: true
        with:
          context: /tmp/build-context
          file: /tmp/build-context/Dockerfile
          token: fake-depot-token
          project: fake-project-id
          save: 'true'
          save-tag: myimage:saved
          save-tags: |
            myimage:tag1
            myimage:tag2
          add-hosts: |
            docker:10.180.0.1
          build-contexts: |
            alpine=docker-image://alpine:latest
          lint: 'true'
          lint-fail-on: error
      - name: Assert action ran
        run: |
          echo "Action completed with outcome: ${{ steps.action.outcome }}"
          echo "PASS: action was invoked with save and lint inputs"
