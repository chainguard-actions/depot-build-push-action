name: Test depot build-push-action - attestation and metadata inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create minimal Dockerfile for test
        run: |
          mkdir -p /tmp/depot-attest-ctx
          cat > /tmp/depot-attest-ctx/Dockerfile <<'EOF'
          FROM scratch
          LABEL test=attestation
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          context: /tmp/depot-attest-ctx
          tags: localhost/test-attest:latest
          annotations: index:org.opencontainers.image.description=Test image
          allow: network.host
          attests: type=sbom,generator=image
          provenance: "false"
          sbom: "false"
          sbom-dir: /tmp/depot-sbom-output
          # No token — action will fail with auth error

      - name: Assert action ran (failed gracefully without token)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no depot token)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
