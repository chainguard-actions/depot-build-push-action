name: Test security and secrets inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create minimal Dockerfile and secret file
        run: |
          mkdir -p /tmp/build-context
          echo 'FROM scratch' > /tmp/build-context/Dockerfile
          echo 'mysecretvalue' > /tmp/secret.txt
      - id: action
        uses: .
        continue-on-error: true
        with:
          context: /tmp/build-context
          file: /tmp/build-context/Dockerfile
          token: fake-depot-token
          project: fake-project-id
          allow: network.host
          secrets: |
            MY_SECRET=mysecretvalue
          secret-files: |
            MY_FILE=/tmp/secret.txt
          ssh: default
          ulimit: nofile=1024:1024
          shm-size: 128m
          cgroup-parent: /docker
      - name: Assert action ran
        run: |
          echo "Action completed with outcome: ${{ steps.action.outcome }}"
          echo "PASS: action was invoked with security and secrets inputs"
