name: Test - Labels, annotations, provenance, sbom, attests with buildx fallback
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install depot CLI
        run: |
          curl -L https://depot.dev/install-cli.sh | DEPOT_INSTALL_DIR=/usr/local/bin sh

      - name: Verify depot CLI is installed
        run: depot version

      - name: Set up Docker Buildx
        run: |
          docker buildx create --use --name labels-builder 2>/dev/null || true

      - name: Create sbom output directory
        run: mkdir -p /tmp/sbom-output

      - id: action
        uses: .
        with:
          context: tests/fixtures/metadata-context
          file: tests/fixtures/metadata-context/Dockerfile
          tags: test-labels-image:latest
          labels: |
            org.opencontainers.image.title=Test Image
            org.opencontainers.image.version=1.0.0
          annotations: |
            org.opencontainers.image.description=Test annotation
          provenance: 'false'
          sbom: 'false'
          sbom-dir: /tmp/sbom-output
          attests: 'type=provenance,mode=min'
          load: 'false'
          push: 'false'
          buildx-fallback: 'true'
        # No depot token — depot build will fail, fallback to docker buildx

      - name: Assert action outcome
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with labels/annotations/provenance/sbom inputs"
          else
            echo "FAIL: expected success, got '$OUTCOME'"
            exit 1
          fi
