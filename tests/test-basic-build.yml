name: Test basic build inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create minimal Dockerfile
        run: |
          mkdir -p /tmp/build-context
          echo 'FROM scratch' > /tmp/build-context/Dockerfile
      - id: action
        uses: .
        continue-on-error: true
        with:
          context: /tmp/build-context
          file: /tmp/build-context/Dockerfile
          tags: myimage:latest
          token: fake-depot-token
          project: fake-project-id
          build-args: |
            FOO=bar
            BAZ=qux
          labels: |
            org.opencontainers.image.title=MyImage
          target: build
      - name: Assert action ran (may fail due to invalid token)
        run: |
          echo "Action completed with outcome: ${{ steps.action.outcome }}"
          echo "PASS: action was invoked with basic build inputs"
