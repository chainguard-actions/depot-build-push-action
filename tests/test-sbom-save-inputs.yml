name: Test depot build-push-action - sbom and save-tags inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create minimal Dockerfile for test
        run: |
          mkdir -p /tmp/depot-sbom-ctx
          mkdir -p /tmp/depot-sbom-dir
          cat > /tmp/depot-sbom-ctx/Dockerfile <<'EOF'
          FROM scratch
          LABEL test=sbom-save
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          context: /tmp/depot-sbom-ctx
          tags: localhost/test-sbom:latest
          sbom: 'false'
          sbom-dir: '/tmp/depot-sbom-dir'
          save: 'false'
          save-tags: 'myimage:v1.0.0'
          # No token — action will fail at auth, but inputs are parsed

      - name: Assert action ran with sbom/save-tags inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with sbom/sbom-dir/save-tags inputs, outcome='$OUTCOME'"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
