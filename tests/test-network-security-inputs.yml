name: Test depot build-push-action - network and security inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create minimal Dockerfile for test
        run: |
          mkdir -p /tmp/depot-net-ctx
          cat > /tmp/depot-net-ctx/Dockerfile <<'EOF'
          FROM scratch
          LABEL test=network-security
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          context: /tmp/depot-net-ctx
          tags: localhost/test-net:latest
          add-hosts: 'docker:10.180.0.1'
          allow: 'network.host'
          annotations: 'org.opencontainers.image.description=test'
          attests: 'type=sbom,generator=image'
          # No token — action will fail at auth, but inputs are parsed

      - name: Assert action ran with network and security inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with add-hosts/allow/annotations/attests inputs, outcome='$OUTCOME'"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
