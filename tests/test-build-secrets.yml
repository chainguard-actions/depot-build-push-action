name: Test - Build secrets inputs (secrets, secret-files)
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install depot CLI
        run: |
          curl -L https://depot.dev/install-cli.sh | DEPOT_INSTALL_DIR=/usr/local/bin sh

      - name: Verify depot CLI is installed
        run: depot version

      - name: Set up Docker Buildx
        run: |
          docker buildx create --use --name secrets-builder --driver docker-container 2>/dev/null || true

      - name: Create secret file for testing
        run: echo "mysecretvalue" > /tmp/test-secret.txt

      - id: action
        uses: .
        with:
          context: tests/fixtures/docker-context
          file: tests/fixtures/docker-context/Dockerfile
          tags: test-secrets:latest
          load: 'false'
          push: 'false'
          buildx-fallback: 'true'
          secrets: 'MY_SECRET=mysecretvalue'
          secret-files: 'MY_SECRET_FILE=/tmp/test-secret.txt'
        # No depot token — depot build will fail, fallback to docker buildx

      - name: Assert build with secrets succeeded
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: build with secrets succeeded via buildx fallback"
          else
            echo "FAIL: expected success, got '$OUTCOME'"
            exit 1
          fi
