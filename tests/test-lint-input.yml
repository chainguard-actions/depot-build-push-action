name: Test depot build-push-action - lint input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create Dockerfile with potential lint issues
        run: |
          mkdir -p /tmp/depot-lint-ctx
          cat > /tmp/depot-lint-ctx/Dockerfile <<'EOF'
          FROM ubuntu:latest
          RUN apt-get update && apt-get install -y curl
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          context: /tmp/depot-lint-ctx
          tags: localhost/test-lint:latest
          lint: 'true'
          lint-fail-on: 'error'
          # No token — action will fail at auth stage, but lint inputs are parsed

      - name: Assert action ran with lint inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # Without a depot token the action fails at authentication.
          # We verify the action ran (not skipped) and produced a deterministic outcome.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with lint inputs, outcome='$OUTCOME'"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
