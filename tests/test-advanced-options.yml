name: Test - Advanced options (add-hosts, allow, ulimit, shm-size) with buildx fallback
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install depot CLI
        run: |
          curl -L https://depot.dev/install-cli.sh | DEPOT_INSTALL_DIR=/usr/local/bin sh

      - name: Verify depot CLI is installed
        run: depot version

      - name: Set up Docker Buildx
        run: |
          docker buildx create --use --name advanced-builder 2>/dev/null || true

      - id: action
        uses: .
        with:
          context: tests/fixtures/advanced-context
          file: tests/fixtures/advanced-context/Dockerfile
          tags: test-advanced-image:latest
          add-hosts: myhost:127.0.0.1
          allow: network.host
          ulimit: nofile=1024:1024
          shm-size: 128m
          load: 'false'
          push: 'false'
          buildx-fallback: 'true'
        # No depot token — depot build will fail, fallback to docker buildx

      - name: Assert action outcome
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with add-hosts/allow/ulimit/shm-size inputs"
          else
            echo "FAIL: expected success, got '$OUTCOME'"
            exit 1
          fi
