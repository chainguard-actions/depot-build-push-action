name: Test - Secrets, secret-files, and ssh inputs with buildx fallback
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install depot CLI
        run: |
          curl -L https://depot.dev/install-cli.sh | DEPOT_INSTALL_DIR=/usr/local/bin sh

      - name: Verify depot CLI is installed
        run: depot version

      - name: Set up Docker Buildx
        run: |
          docker buildx create --use --name secrets-builder 2>/dev/null || true

      - name: Create secret file for testing
        run: |
          echo "mysecretvalue" > /tmp/test-secret.txt

      - id: action
        uses: .
        with:
          context: tests/fixtures/secrets-context
          file: tests/fixtures/secrets-context/Dockerfile
          tags: test-secrets-image:latest
          secrets: |
            MY_SECRET=mysecretvalue
          secret-files: |
            MY_SECRET_FILE=/tmp/test-secret.txt
          ssh: default
          load: 'false'
          push: 'false'
          buildx-fallback: 'true'
        # No depot token — depot build will fail, fallback to docker buildx

      - name: Assert action outcome
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with secrets/secret-files/ssh inputs"
          else
            echo "FAIL: expected success, got '$OUTCOME'"
            exit 1
          fi
