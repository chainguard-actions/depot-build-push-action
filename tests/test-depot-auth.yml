name: Test - Depot auth inputs (project, token)
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install depot CLI
        run: |
          curl -L https://depot.dev/install-cli.sh | DEPOT_INSTALL_DIR=/usr/local/bin sh

      - name: Verify depot CLI is installed
        run: depot version

      - name: Set up Docker Buildx
        run: |
          docker buildx create --use --name depot-auth-builder 2>/dev/null || true

      - id: action
        uses: .
        continue-on-error: true
        with:
          context: tests/fixtures/docker-context
          file: tests/fixtures/docker-context/Dockerfile
          tags: test-depot-auth:latest
          load: 'false'
          push: 'false'
          buildx-fallback: 'true'
          project: 'test-project-id'
          token: 'invalid-depot-token-for-testing'
        # Providing an invalid token — depot build will fail, fallback to docker buildx
        # The project and token inputs are exercised even though the token is invalid

      - name: Assert action ran with depot auth inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (buildx fallback used after depot auth failure)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran and failed gracefully (invalid depot token as expected)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
