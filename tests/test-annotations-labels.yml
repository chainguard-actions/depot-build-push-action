name: Test - Annotations and labels inputs
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install depot CLI
        run: |
          curl -L https://depot.dev/install-cli.sh | DEPOT_INSTALL_DIR=/usr/local/bin sh

      - name: Verify depot CLI is installed
        run: depot version

      - name: Set up Docker Buildx
        run: |
          docker buildx create --use --name annotations-builder 2>/dev/null || true

      - id: action
        uses: .
        with:
          context: tests/fixtures/docker-context
          file: tests/fixtures/docker-context/Dockerfile
          tags: test-annotations:latest
          load: 'false'
          push: 'false'
          buildx-fallback: 'true'
          annotations: 'org.opencontainers.image.description=Test image'
          labels: |
            org.opencontainers.image.title=test
            org.opencontainers.image.version=1.0.0
        # No depot token — depot build will fail, fallback to docker buildx

      - name: Assert build with annotations and labels succeeded
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: build with annotations and labels succeeded via buildx fallback"
          else
            echo "FAIL: expected success, got '$OUTCOME'"
            exit 1
          fi
