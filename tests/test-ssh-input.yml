name: Test - SSH input for build
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install depot CLI
        run: |
          curl -L https://depot.dev/install-cli.sh | DEPOT_INSTALL_DIR=/usr/local/bin sh

      - name: Verify depot CLI is installed
        run: depot version

      - name: Set up Docker Buildx
        run: |
          docker buildx create --use --name ssh-builder --driver docker-container 2>/dev/null || true

      - name: Set up SSH agent
        run: |
          eval "$(ssh-agent -s)"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> $GITHUB_ENV

      - id: action
        uses: .
        continue-on-error: true
        with:
          context: tests/fixtures/docker-context
          file: tests/fixtures/docker-context/Dockerfile
          tags: test-ssh:latest
          load: 'false'
          push: 'false'
          buildx-fallback: 'true'
          ssh: 'default'
        # No depot token — depot build will fail, fallback to docker buildx
        # SSH forwarding may or may not work depending on environment

      - name: Assert action ran with ssh input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: build with ssh input succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran and failed gracefully (ssh agent may not be available)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
