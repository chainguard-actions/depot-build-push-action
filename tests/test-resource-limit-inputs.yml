name: Test depot build-push-action - resource limit inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create minimal Dockerfile for test
        run: |
          mkdir -p /tmp/depot-resource-ctx
          cat > /tmp/depot-resource-ctx/Dockerfile <<'EOF'
          FROM scratch
          LABEL test=resource-limits
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          context: /tmp/depot-resource-ctx
          tags: localhost/test-resource:latest
          cgroup-parent: 'docker'
          network: 'host'
          shm-size: '128m'
          ulimit: 'nofile=1024:1024'
          # No token — action will fail at auth, but inputs are parsed

      - name: Assert action ran with resource limit inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with cgroup-parent/network/shm-size/ulimit inputs, outcome='$OUTCOME'"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
