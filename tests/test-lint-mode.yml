name: Test - Lint mode with buildx fallback
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install depot CLI
        run: |
          curl -L https://depot.dev/install-cli.sh | DEPOT_INSTALL_DIR=/usr/local/bin sh

      - name: Verify depot CLI is installed
        run: depot version

      - name: Set up Docker Buildx
        run: |
          docker buildx create --use --name lint-builder 2>/dev/null || true

      - id: action
        uses: .
        with:
          context: tests/fixtures/lint-context
          file: tests/fixtures/lint-context/Dockerfile
          tags: test-lint-image:latest
          load: 'false'
          push: 'false'
          lint: 'true'
          lint-fail-on: 'error'
          buildx-fallback: 'true'
        # No depot token — depot build will fail, fallback to docker buildx
        # Lint is a depot-specific feature; in fallback mode it won't run lint

      - name: Assert action outcome
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (lint passed or fallback succeeded)"
          else
            echo "FAIL: expected success, got '$OUTCOME'"
            exit 1
          fi
