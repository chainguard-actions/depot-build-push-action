name: Test build failure without fallback
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FAKE_DEPOT_FAIL: '1'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install fake depot CLI
        run: |
          rm -rf /tmp/fake-depot /tmp/fake-bin
          mkdir -p /tmp/fake-bin
          cp tests/fixtures/fake-depot.sh /tmp/fake-bin/depot
          chmod +x /tmp/fake-bin/depot
          echo "/tmp/fake-bin" >> "$GITHUB_PATH"
      - id: action
        uses: .
        continue-on-error: true
        with:
          context: .
          token: fake-depot-token
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
          DIGEST: ${{ steps.action.outputs.digest }}
        run: |
          echo "outcome: $OUTCOME digest: '$DIGEST'"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure outcome"
            exit 1
          fi
          if [ -n "$DIGEST" ]; then
            echo "FAIL: digest should be empty on failure"
            exit 1
          fi
          [ -f /tmp/fake-depot/args ] || { echo "FAIL: depot build was not invoked"; exit 1; }
          echo "PASS"
