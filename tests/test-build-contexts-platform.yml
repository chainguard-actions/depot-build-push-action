name: Test depot build-push-action - build-contexts and build-platform inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create minimal Dockerfile for test
        run: |
          mkdir -p /tmp/depot-ctx-platform
          cat > /tmp/depot-ctx-platform/Dockerfile <<'EOF'
          FROM scratch
          LABEL test=build-contexts-platform
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          context: /tmp/depot-ctx-platform
          tags: localhost/test-ctx-platform:latest
          build-contexts: 'myctx=/tmp/depot-ctx-platform'
          build-platform: 'linux/amd64'
          # No token — action will fail at auth, but inputs are parsed

      - name: Assert action ran with build-contexts and build-platform inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with build-contexts/build-platform inputs, outcome='$OUTCOME'"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
