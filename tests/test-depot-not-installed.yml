name: Test depot CLI not installed
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Ensure depot CLI is not available
        run: |
          rm -rf /tmp/fake-depot
          if command -v depot >/dev/null 2>&1; then
            echo "depot unexpectedly present at $(command -v depot)"
          else
            echo "depot not on PATH (expected)"
          fi
      - id: action
        if: ${{ always() }}
        uses: .
        continue-on-error: true
        with:
          context: .
          token: fake-depot-token
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if command -v depot >/dev/null 2>&1; then
            echo "SKIP-equivalent: depot is preinstalled on this runner; outcome=$OUTCOME"
            [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ] || { echo "FAIL: unexpected outcome"; exit 1; }
            exit 0
          fi
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when depot CLI is missing"
            exit 1
          fi
          if [ -f /tmp/fake-depot/args ]; then
            echo "FAIL: no build should have run"
            exit 1
          fi
          echo "PASS"
