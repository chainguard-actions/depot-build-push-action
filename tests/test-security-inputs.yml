name: Test security and attestation inputs coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          token: fake-depot-token
          project: fake-project-id
          allow: network.host
          annotations: index,manifest:org.opencontainers.image.title=myimage
          attests: type=sbom,generator=image
          provenance: 'false'
          sbom: 'false'
          sbom-dir: /tmp/sboms
          secrets: MY_SECRET=mysecretvalue
          secret-files: MY_FILE=./README.md
          ssh: default
          add-hosts: docker:10.180.0.1
      - name: Assert action ran (may fail due to invalid token)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          echo "PASS: action step executed"
