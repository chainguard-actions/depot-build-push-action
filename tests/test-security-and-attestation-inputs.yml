name: Test security and attestation inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create minimal Dockerfile and secret file
        run: |
          mkdir -p /tmp/build-context
          echo 'FROM scratch' > /tmp/build-context/Dockerfile
          echo 'mysecretvalue' > /tmp/mysecret.txt
          mkdir -p /tmp/sbom-output
      - id: action
        uses: .
        continue-on-error: true
        with:
          context: /tmp/build-context
          token: fake-depot-token
          project: fake-project-id
          push: 'false'
          provenance: 'false'
          sbom: 'false'
          sbom-dir: /tmp/sbom-output
          secrets: |
            MY_SECRET=mysecretvalue
          secret-files: |
            MY_FILE=/tmp/mysecret.txt
          ssh: default
          build-platform: linux/amd64
          lint: 'false'
          lint-fail-on: error
          save: 'false'
          save-tag: myimage:saved
          save-tags: |
            myimage:saved1
            myimage:saved2
      - name: Verify action ran (may fail without real token)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          echo "PASS: action step was invoked with security and attestation inputs"
