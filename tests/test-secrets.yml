name: Test secrets and secret files
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install fake depot CLI and secret file
        run: |
          rm -rf /tmp/fake-depot /tmp/fake-bin
          mkdir -p /tmp/fake-bin
          cp tests/fixtures/fake-depot.sh /tmp/fake-bin/depot
          chmod +x /tmp/fake-bin/depot
          echo "/tmp/fake-bin" >> "$GITHUB_PATH"
          printf 'file-secret-value' > /tmp/my-secret.txt
      - id: action
        uses: .
        with:
          context: .
          token: fake-depot-token
          secrets: |
            MY_SECRET=inline-secret-value
          secret-files: |
            MY_FILE_SECRET=/tmp/my-secret.txt
      - name: Assert secrets passed
        run: |
          cat /tmp/fake-depot/args
          echo "--- secrets ---"
          cat /tmp/fake-depot/secrets
          fail=0
          grep -qxF 'MY_SECRET=inline-secret-value' /tmp/fake-depot/secrets || { echo "FAIL: inline secret"; fail=1; }
          grep -qxF 'MY_FILE_SECRET=file-secret-value' /tmp/fake-depot/secrets || { echo "FAIL: file secret"; fail=1; }
          COUNT=$(grep -cxF -- --secret /tmp/fake-depot/args)
          [ "$COUNT" = "2" ] || { echo "FAIL: expected 2 --secret flags, got $COUNT"; fail=1; }
          [ $fail -eq 0 ] || exit 1
          echo "PASS"
