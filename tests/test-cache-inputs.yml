name: Test cache and output inputs coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          token: fake-depot-token
          project: fake-project-id
          cache-from: type=gha
          cache-to: type=gha,mode=max
          no-cache-filters: my-stage
          outputs: type=local,dest=/tmp/output
      - name: Assert action ran (may fail due to invalid token)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          echo "PASS: action step executed"
