name: Test depot build-push-action - cache inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create minimal Dockerfile for test
        run: |
          mkdir -p /tmp/depot-cache-ctx
          cat > /tmp/depot-cache-ctx/Dockerfile <<'EOF'
          FROM scratch
          LABEL test=cache
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          context: /tmp/depot-cache-ctx
          tags: localhost/test-cache:latest
          cache-from: 'type=local,src=/tmp/depot-cache-src'
          cache-to: 'type=local,dest=/tmp/depot-cache-dest'
          # No token — action will fail at auth, but inputs are parsed

      - name: Assert action ran with cache inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with cache-from/cache-to inputs, outcome='$OUTCOME'"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
