name: Test depot build-push-action - platforms, target, file, and outputs inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create multi-stage Dockerfile for test
        run: |
          mkdir -p /tmp/depot-platforms-ctx
          cat > /tmp/depot-platforms-ctx/Dockerfile <<'EOF'
          FROM scratch AS base
          LABEL test=platforms
          FROM base AS final
          LABEL stage=final
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          context: /tmp/depot-platforms-ctx
          file: /tmp/depot-platforms-ctx/Dockerfile
          tags: localhost/test-platforms:latest
          platforms: linux/amd64,linux/arm64
          target: final
          outputs: type=tar,dest=/tmp/depot-output.tar
          # No token — action will fail with auth error

      - name: Assert action ran (failed gracefully without token)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no depot token)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
