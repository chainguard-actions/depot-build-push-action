name: Test - Cache options (cache-from, cache-to)
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install depot CLI
        run: |
          curl -L https://depot.dev/install-cli.sh | DEPOT_INSTALL_DIR=/usr/local/bin sh

      - name: Verify depot CLI is installed
        run: depot version

      - name: Set up Docker Buildx
        run: |
          docker buildx create --use --name cache-builder --driver docker-container 2>/dev/null || true

      - name: Create local cache directories
        run: |
          mkdir -p /tmp/cache-src
          mkdir -p /tmp/cache-dest

      - id: action
        uses: .
        continue-on-error: true
        with:
          context: tests/fixtures/docker-context
          file: tests/fixtures/docker-context/Dockerfile
          tags: test-cache:latest
          load: 'false'
          push: 'false'
          buildx-fallback: 'true'
          cache-from: 'type=local,src=/tmp/cache-src'
          cache-to: 'type=local,dest=/tmp/cache-dest,mode=max'
        # No depot token — depot build will fail, fallback to docker buildx
        # Local cache may or may not be populated; accept success or graceful failure

      - name: Assert action ran with cache inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: build with cache options succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran and failed gracefully (cache options may not be fully supported in this environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
